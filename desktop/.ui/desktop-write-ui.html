<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>文章创作 · 编辑器</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  :root {
    --bg: #f5f5f4;
    --panel: #ffffff;
    --line: #e7e5e4;
    --ink: #1c1917;
    --ink-2: #57534e;
    --ink-3: #a8a29e;
    --accent: #1c1917;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .serif { font-family: "Songti SC", "Noto Serif SC", "STSong", "SimSun", Georgia, serif; }
  .mono  { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  /* scrollbars */
  .scroll::-webkit-scrollbar { width: 6px; height: 6px; }
  .scroll::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 99px; }
  .scroll::-webkit-scrollbar-thumb:hover { background: #a8a29e; }
  .scroll::-webkit-scrollbar-track { background: transparent; }

  /* icon button */
  .ibtn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 8px; color: var(--ink-2);
    transition: background .15s, color .15s;
  }
  .ibtn:hover { background: #f5f5f4; color: var(--ink); }
  .ibtn.active { background: #1c1917; color: #fff; }
  .ibtn:disabled { opacity: .35; pointer-events: none; }

  /* segmented */
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: #efeeec; border-radius: 10px; padding: 3px; }
  .seg button { height: 32px; border-radius: 8px; font-size: 13px; color: var(--ink-2); display: flex; align-items: center; justify-content: center; gap: 6px; transition: all .15s; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.03); font-weight: 500; }
  .seg button:not(.on):hover { color: var(--ink); }

  /* article card */
  .card {
    display: flex; gap: 12px; padding: 10px; border-radius: 12px; cursor: pointer;
    border: 1px solid transparent; transition: background .15s, border-color .15s, box-shadow .15s;
    position: relative;
  }
  .card:hover { background: #fafaf9; border-color: var(--line); }
  .card.selected { background: #fff; border-color: #1c1917; box-shadow: 0 0 0 3px rgba(28,25,23,.06); }
  .card .thumb { width: 68px; height: 52px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: #e7e5e4; }
  .card .thumb-empty { width: 68px; height: 52px; border-radius: 8px; flex-shrink: 0; background: #f5f5f4; border: 1px dashed #d6d3d1; display: flex; align-items: center; justify-content: center; color: #a8a29e; }
  .badge { font-size: 11px; line-height: 1; padding: 4px 7px; border-radius: 6px; white-space: nowrap; font-weight: 500; }
  .badge.draft { background: #fef3c7; color: #b45309; }
  .badge.pub   { background: #dcfce7; color: #15803d; }

  /* switch */
  .switch { width: 36px; height: 20px; border-radius: 99px; background: #d6d3d1; position: relative; transition: background .2s; cursor: pointer; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .2s; }
  .switch.on { background: #16a34a; }
  .switch.on::after { transform: translateX(16px); }

  /* toolbar */
  .tb-sel { height: 32px; padding: 0 10px; border-radius: 8px; font-size: 13px; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; transition: background .15s; }
  .tb-sel:hover { background: #f5f5f4; }
  .tb-div { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }

  /* editor content */
  .prose-edit { font-size: 18px; line-height: 1.85; color: var(--ink); outline: none; }
  .prose-edit ol { list-style: decimal; padding-left: 1.6em; margin: 0.4em 0; }
  .prose-edit ol ol { margin: 0.3em 0 0.3em; }
  .prose-edit li { padding-left: .25em; margin: .25em 0; }
  .prose-edit li::marker { color: var(--ink-2); }
  .prose-edit p { margin: .6em 0; }
  .prose-edit p:empty::before { content: ""; display: inline-block; }
  .prose-edit hr { border: 0; border-top: 1px solid #d6d3d1; margin: 1.6em 0; }
  .prose-edit .is-empty::before { content: attr(data-ph); color: #a8a29e; pointer-events: none; float: left; height: 0; }
  .block-handle { position: absolute; left: -34px; top: 4px; opacity: 0; transition: opacity .15s; color: #a8a29e; cursor: grab; }
  .block:hover .block-handle { opacity: 1; }
  .block { position: relative; }

  /* material tabs */
  .mtab { height: 28px; padding: 0 12px; border-radius: 7px; font-size: 13px; color: var(--ink-2); transition: all .15s; }
  .mtab.on { background: #1c1917; color: #fff; font-weight: 500; }
  .mtab:not(.on):hover { background: #f5f5f4; color: var(--ink); }

  /* dropzone */
  .drop { border: 1.5px dashed #d6d3d1; border-radius: 16px; transition: border-color .2s, background .2s; }
  .drop:hover, .drop.over { border-color: #78716c; background: #fafaf9; }

  .fade-in { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(2px);} to { opacity: 1; transform: none;} }

  .tip { position: relative; }
  .tip::after {
    content: attr(data-tip); position: absolute; left: 50%; top: calc(100% + 6px); transform: translateX(-50%) translateY(-2px);
    background: #1c1917; color: #fff; font-size: 11px; padding: 4px 8px; border-radius: 6px; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; z-index: 30;
  }
  .tip:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ===== Window Chrome ===== -->
<div class="h-screen flex flex-col">
  <div class="h-9 flex items-center justify-between px-3 select-none bg-white/60 border-b border-stone-200/60" style="-webkit-app-region: drag;">
    <div class="flex items-center gap-2 text-[12px] text-stone-400">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>MO Gallery · 文章创作</span>
    </div>
    <div class="flex items-center gap-1 text-stone-500">
      <button class="w-10 h-7 rounded hover:bg-stone-200/70 flex items-center justify-center"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button class="w-10 h-7 rounded hover:bg-stone-200/70 flex items-center justify-center"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button class="w-10 h-7 rounded hover:bg-red-500 hover:text-white flex items-center justify-center"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
  </div>

  <!-- ===== App Header ===== -->
  <header class="h-16 flex items-center justify-between px-6 border-b border-stone-200 bg-white">
    <div class="flex items-center gap-3">
      <h1 class="serif text-[22px] font-semibold tracking-wide">文章创作</h1>
      <span class="text-[12px] text-stone-400 mt-1">共 <span class="mono">11</span> 篇 · 草稿 <span class="mono">4</span> · 已发布 <span class="mono">7</span></span>
    </div>
    <div class="flex items-center gap-2">
      <button class="h-9 px-3 rounded-lg text-[13px] text-stone-600 hover:bg-stone-100 flex items-center gap-1.5">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        设置
      </button>
      <button class="h-9 pl-3 pr-4 rounded-lg bg-stone-900 text-white text-[13px] font-medium hover:bg-stone-800 active:scale-[.98] transition flex items-center gap-1.5 shadow-sm">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
        新建文章
      </button>
    </div>
  </header>

  <!-- ===== Main 3 columns ===== -->
  <div class="flex-1 flex min-h-0">

    <!-- ===== Left: Article list ===== -->
    <aside class="w-[300px] flex-shrink-0 flex flex-col border-r border-stone-200 bg-white">
      <div class="p-4 pb-3 space-y-3 border-b border-stone-100">
        <div class="seg" id="seg">
          <button class="on" data-k="story">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>叙事
          </button>
          <button data-k="blog">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>博客
          </button>
          <button data-k="draft">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>草稿
          </button>
        </div>
        <div class="flex items-center gap-2">
          <label class="flex-1 h-9 flex items-center gap-2 px-3 rounded-lg bg-stone-100 focus-within:bg-white focus-within:ring-2 focus-within:ring-stone-900/10 focus-within:border-stone-300 border border-transparent transition">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-stone-400"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="search" type="text" placeholder="搜索标题…" class="flex-1 bg-transparent outline-none text-[13px] placeholder:text-stone-400 min-w-0" />
          </label>
          <div class="relative">
            <select id="statusSel" class="appearance-none h-9 pl-3 pr-7 rounded-lg bg-stone-100 hover:bg-stone-200/70 text-[13px] outline-none cursor-pointer">
              <option value="all">全部状态</option>
              <option value="draft">草稿</option>
              <option value="pub">已发布</option>
            </select>
            <svg class="absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none text-stone-500" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
          </div>
          <button class="ibtn tip bg-stone-100 hover:bg-stone-200/70" data-tip="刷新" onclick="spin(this)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto scroll px-3 py-3" id="list"></div>
    </aside>

    <!-- ===== Center: Editor ===== -->
    <main class="flex-1 min-w-0 flex flex-col bg-white">
      <!-- Editor top bar -->
      <div class="h-[68px] px-5 flex items-center gap-2 border-b border-stone-100">
        <button class="ibtn tip border border-stone-200" data-tip="返回">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button class="ibtn tip border border-stone-200" data-tip="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
        <div class="flex-1 min-w-0 px-3">
          <input id="title" value="tiptap编辑器测试" class="serif w-full text-[26px] font-medium tracking-wide outline-none bg-transparent placeholder:text-stone-300 truncate" placeholder="请输入标题…" />
        </div>
        <div class="flex items-center gap-2 flex-shrink-0">
          <div class="flex items-center gap-2 h-9 px-3 rounded-lg border border-stone-200 select-none cursor-pointer" onclick="toggleStatus(this)">
            <div class="switch" id="statusSwitch"></div>
            <span class="text-[13px] text-stone-600" id="statusText">草稿</span>
          </div>
          <button class="h-9 px-3 rounded-lg border border-stone-200 text-[13px] text-stone-700 hover:bg-stone-50 flex items-center gap-1.5">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>预览
          </button>
          <button class="h-9 px-3 rounded-lg border border-stone-200 text-[13px] text-stone-700 hover:bg-stone-50 flex items-center gap-1.5">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>沉浸
          </button>
          <button class="h-9 px-4 rounded-lg bg-stone-900 text-white text-[13px] font-medium hover:bg-stone-800 active:scale-[.98] transition flex items-center gap-1.5 shadow-sm">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>保存
          </button>
        </div>
      </div>

      <!-- Meta -->
      <div class="h-10 px-6 flex items-center gap-4 text-[12px] text-stone-400 border-b border-stone-100">
        <span class="flex items-center gap-1.5">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span class="mono">2026/8/14 21:09:18</span>
        </span>
        <span class="w-px h-3 bg-stone-200"></span>
        <span class="flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>已自动保存
        </span>
      </div>

      <!-- Toolbar -->
      <div class="h-12 px-4 flex items-center gap-0.5 border-b border-stone-200 bg-white sticky top-0 z-10">
        <button class="tb-sel min-w-[64px]">正文<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-stone-400"><path d="m6 9 6 6 6-6"/></svg></button>
        <button class="tb-sel min-w-[120px]">PingFang SC<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-stone-400"><path d="m6 9 6 6 6-6"/></svg></button>
        <button class="tb-sel mono min-w-[64px]">18px<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-stone-400"><path d="m6 9 6 6 6-6"/></svg></button>
        <span class="tb-div"></span>
        <button class="ibtn tip" data-tip="加粗 ⌘B" onclick="fmt('bold',this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 4h8a4 4 0 0 1 0 8H6zM6 12h9a4 4 0 0 1 0 8H6z"/></svg></button>
        <button class="ibtn tip" data-tip="斜体 ⌘I" onclick="fmt('italic',this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 4h-9M14 20H5M15 4 9 20"/></svg></button>
        <button class="ibtn tip" data-tip="下划线 ⌘U" onclick="fmt('underline',this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4v6a6 6 0 0 0 12 0V4M4 20h16"/></svg></button>
        <button class="ibtn tip" data-tip="删除线" onclick="fmt('strikeThrough',this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4H9a3 3 0 0 0-2.83 4M14 12a4 4 0 0 1 0 8H6M4 12h16"/></svg></button>
        <span class="tb-div"></span>
        <button class="tb-sel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-stone-400"><path d="m6 9 6 6 6-6"/></svg></button>
        <button class="tb-sel"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-stone-400"><path d="m6 9 6 6 6-6"/></svg></button>
        <span class="tb-div"></span>
        <button class="ibtn tip" data-tip="撤销 ⌘Z" onclick="document.execCommand('undo')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg></button>
        <button class="ibtn tip" data-tip="重做 ⇧⌘Z" onclick="document.execCommand('redo')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 15-6.7L21 13"/></svg></button>
        <button class="tb-sel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-stone-400"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="flex-1"></div>
        <button class="ibtn tip" data-tip="收起素材库" onclick="togglePanel()"><svg id="panelIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16M11 10l-2 2 2 2"/></svg></button>
      </div>

      <!-- Editor body -->
      <div class="flex-1 overflow-y-auto scroll relative" id="editorScroll">
        <button class="absolute right-6 top-5 w-10 h-10 rounded-xl bg-white border border-stone-200 shadow-sm hover:shadow-md hover:-translate-y-px transition flex items-center justify-center text-stone-700 tip z-10" data-tip="AI 助手">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 17l.7 1.8L21.5 19.5l-1.8.7L19 22l-.7-1.8-1.8-.7 1.8-.7z"/></svg>
        </button>

        <div class="max-w-[760px] mx-auto px-14 py-8">
          <div id="editor" class="prose-edit" contenteditable="true" spellcheck="false">
            <div class="block">
              <span class="block-handle"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span>
              <ol>
                <li>有序1
                  <ol>
                    <li>sad</li>
                    <li><br></li>
                    <li>sad</li>
                  </ol>
                </li>
                <li>打算</li>
                <li>打算</li>
                <li>有序2</li>
              </ol>
            </div>
            <div class="block">
              <span class="block-handle"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span>
              <hr>
            </div>
            <div class="block">
              <span class="block-handle"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span>
              <p>大</p>
            </div>
            <div class="block">
              <span class="block-handle"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span>
              <p>阿萨德打算</p>
            </div>
            <div class="block">
              <p class="is-empty" data-ph="输入 / 唤起命令，或直接开始写作…"><br></p>
            </div>
          </div>
        </div>
      </div>

      <!-- Status bar -->
      <div class="h-10 px-5 flex items-center gap-5 text-[12px] text-stone-500 border-t border-stone-200 bg-stone-50/60">
        <span class="flex items-center gap-1.5">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>
          <span class="mono" id="charCount">29</span> 个字符
        </span>
        <span class="flex items-center gap-1.5">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          <span class="mono">0</span> 项素材
        </span>
        <div class="flex-1"></div>
        <span class="text-stone-400">预计阅读 <span class="mono">1</span> 分钟</span>
      </div>
    </main>

    <!-- ===== Right: Material library ===== -->
    <aside id="panel" class="w-[320px] flex-shrink-0 flex flex-col border-l border-stone-200 bg-stone-50/50 transition-all duration-200 overflow-hidden">
      <div class="h-[68px] px-4 flex items-center justify-between border-b border-stone-200/70 bg-white">
        <div class="flex items-center gap-2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="text-stone-700"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          <span class="text-[15px] font-semibold">素材库</span>
          <span class="mono text-[12px] px-1.5 h-5 min-w-5 rounded-md bg-stone-100 text-stone-500 flex items-center justify-center">0</span>
        </div>
        <div class="flex items-center gap-1">
          <button class="h-8 px-2.5 rounded-lg text-[12px] text-stone-500 hover:bg-stone-100 hover:text-stone-800">上传设置</button>
          <button class="h-8 px-2.5 rounded-lg text-[13px] font-medium text-stone-800 hover:bg-stone-100 flex items-center gap-1">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>添加照片
          </button>
        </div>
      </div>

      <div class="h-12 px-4 flex items-center gap-1 border-b border-stone-200/70 bg-white" id="mtabs">
        <button class="mtab on">全部</button>
        <button class="mtab">已使用</button>
        <button class="mtab">未使用</button>
        <div class="flex-1"></div>
        <button class="ibtn tip w-8 h-8" data-tip="网格视图"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
      </div>

      <div class="flex-1 p-4 flex flex-col">
        <div class="drop flex-1 flex flex-col items-center justify-center text-center px-6" id="drop">
          <div class="w-16 h-16 rounded-2xl bg-white border border-stone-200 shadow-sm flex items-center justify-center text-stone-500 mb-5">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/></svg>
          </div>
          <p class="text-[15px] font-medium text-stone-800">拖拽图片到此处</p>
          <p class="text-[12px] text-stone-400 mt-1.5 leading-relaxed">或先关联图片，再插入到正文<br>支持 JPG / PNG / HEIC / RAW</p>
          <button class="mt-5 h-9 px-4 rounded-lg bg-white border border-stone-200 text-[13px] text-stone-800 hover:bg-stone-50 hover:border-stone-300 transition flex items-center gap-1.5 shadow-sm">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
            从图库选择
          </button>
        </div>
      </div>
    </aside>
  </div>
</div>

<script>
  const imgs = [
    null,
    "https://images.pexels.com/photos/1028896/pexels-photo-1028896.jpeg?auto=compress&cs=tinysrgb&dpr=1&fit=crop&h=200&w=280",
    "https://images.pexels.com/photos/16433691/pexels-photo-16433691.jpeg?auto=compress&cs=tinysrgb&dpr=1&fit=crop&h=200&w=280",
    "https://images.pexels.com/photos/17286482/pexels-photo-17286482.jpeg?auto=compress&cs=tinysrgb&dpr=1&fit=crop&h=200&w=280",
    "https://images.pexels.com/photos/19975678/pexels-photo-19975678.jpeg?auto=compress&cs=tinysrgb&dpr=1&fit=crop&h=200&w=280",
    "https://images.pexels.com/photos/18110122/pexels-photo-18110122.jpeg?auto=compress&cs=tinysrgb&dpr=1&fit=crop&h=200&w=280",
    "https://images.pexels.com/photos/39064824/pexels-photo-39064824.jpeg?auto=compress&cs=tinysrgb&dpr=1&fit=crop&h=200&w=280",
    "https://images.pexels.com/photos/14754969/pexels-photo-14754969.jpeg?auto=compress&cs=tinysrgb&dpr=1&fit=crop&h=200&w=280",
    "https://images.pexels.com/photos/29210942/pexels-photo-29210942.jpeg?auto=compress&cs=tinysrgb&dpr=1&fit=crop&h=200&w=280",
    "https://images.pexels.com/photos/23540328/pexels-photo-23540328.jpeg?auto=compress&cs=tinysrgb&dpr=1&fit=crop&h=200&w=280",
    "https://images.pexels.com/photos/374710/pexels-photo-374710.jpeg?auto=compress&cs=tinysrgb&dpr=1&fit=crop&h=200&w=280",
  ];
  const articles = [
    { t:"tiptap编辑器测试", d:"2026/8/14", n:0, s:"draft", g:"本月" },
    { t:"MO Gallery 桌面端发布 摄影师的下一站", d:"2026/8/11", n:9, s:"draft", g:"本月" },
    { t:"建德一人游·不负好时光", d:"2026/5/31", n:1, s:"draft", g:"更早" },
    { t:"OPPO Find X8 | 滨江骑行", d:"2026/5/1", n:12, s:"pub", g:"更早" },
    { t:"胶片X乐凯C200 | 马桥童心园", d:"2026/4/25", n:12, s:"pub", g:"更早" },
    { t:"OPPO Find X8 | 未被打扰的午后", d:"2026/4/12", n:10, s:"pub", g:"更早" },
    { t:"LUMIX S5 | 春日的闵行体育公园", d:"2026/3/31", n:16, s:"pub", g:"更早" },
    { t:"OPPO Find X8 | 昆阳记忆", d:"2026/3/21", n:3, s:"draft", g:"更早" },
    { t:"OPPO Find X8 | 黑白的世界", d:"2026/3/21", n:2, s:"pub", g:"更早" },
    { t:"OPPO Find X8 | 小公园的故事", d:"2026/3/15", n:16, s:"pub", g:"更早" },
    { t:"OPPO Find X8 | 地铁一号线随拍", d:"2026/3/2", n:7, s:"pub", g:"更早" },
  ];
  let selected = 0;

  const calIcon = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
  const imgIcon = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>';
  const bookIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';

  function render(){
    const q = document.getElementById('search').value.trim().toLowerCase();
    const st = document.getElementById('statusSel').value;
    const list = document.getElementById('list');
    let html = ''; let lastG = null; let shown = 0;
    articles.forEach((a,i)=>{
      if(q && !a.t.toLowerCase().includes(q)) return;
      if(st!=='all' && a.s!==st) return;
      shown++;
      if(a.g!==lastG){
        html += `<div class="px-1 pt-1 pb-2 ${lastG?'mt-3':''} text-[11px] font-medium tracking-wider text-stone-400 uppercase">${a.g}</div>`;
        lastG = a.g;
      }
      const thumb = imgs[i] ? `<img class="thumb" src="${imgs[i]}" alt="" loading="lazy">` : `<div class="thumb-empty">${bookIcon}</div>`;
      html += `
        <div class="card fade-in mb-1.5 ${i===selected?'selected':''}" onclick="selectCard(${i})">
          ${thumb}
          <div class="flex-1 min-w-0">
            <div class="flex items-start justify-between gap-2">
              <p class="serif text-[14.5px] font-medium leading-5 truncate">${a.t}</p>
              <span class="badge ${a.s}">${a.s==='draft'?'草稿':'已发布'}</span>
            </div>
            <div class="mt-1.5 flex items-center gap-3 text-[11.5px] text-stone-400">
              <span class="flex items-center gap-1">${calIcon}<span class="mono">${a.d}</span></span>
              ${a.n>0?`<span class="flex items-center gap-1">${imgIcon}<span class="mono">${a.n}</span></span>`:''}
            </div>
          </div>
        </div>`;
    });
    if(!shown) html = `<div class="py-16 text-center text-[13px] text-stone-400">没有匹配的文章</div>`;
    list.innerHTML = html;
  }
  function selectCard(i){
    selected = i; render();
    const a = articles[i];
    document.getElementById('title').value = a.t;
    const sw = document.getElementById('statusSwitch');
    sw.classList.toggle('on', a.s==='pub');
    document.getElementById('statusText').textContent = a.s==='pub' ? '已发布' : '草稿';
  }
  document.getElementById('search').addEventListener('input', render);
  document.getElementById('statusSel').addEventListener('change', render);
  render();

  // segmented
  document.querySelectorAll('#seg button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#seg button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  }));
  // material tabs
  document.querySelectorAll('#mtabs .mtab').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#mtabs .mtab').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  }));

  function toggleStatus(el){
    const sw = document.getElementById('statusSwitch');
    sw.classList.toggle('on');
    const pub = sw.classList.contains('on');
    document.getElementById('statusText').textContent = pub ? '已发布' : '草稿';
    articles[selected].s = pub ? 'pub' : 'draft'; render();
  }
  function fmt(cmd, btn){
    document.execCommand(cmd,false,null);
    document.getElementById('editor').focus();
    updateActive();
  }
  function updateActive(){
    const map = {bold:0,italic:1,underline:2,strikeThrough:3};
    const btns = document.querySelectorAll('.h-12 .ibtn.tip');
    Object.entries(map).forEach(([c,i])=>{ try{ btns[i].classList.toggle('active', document.queryCommandState(c)); }catch(e){} });
  }
  document.addEventListener('selectionchange', updateActive);

  const editor = document.getElementById('editor');
  function count(){
    const txt = editor.innerText.replace(/\s+/g,'');
    document.getElementById('charCount').textContent = txt.length;
    editor.querySelectorAll('p[data-ph]').forEach(p=>p.classList.toggle('is-empty', p.innerText.trim()===''));
  }
  editor.addEventListener('input', count); count();

  function spin(btn){
    const svg = btn.querySelector('svg');
    svg.style.transition='transform .6s'; svg.style.transform='rotate(360deg)';
    setTimeout(()=>{svg.style.transition='none';svg.style.transform='none';},650);
  }
  function togglePanel(){
    const p = document.getElementById('panel');
    const collapsed = p.classList.toggle('w-0');
    p.classList.toggle('w-[320px]', !collapsed);
    p.classList.toggle('border-l', !collapsed);
  }
  const drop = document.getElementById('drop');
  ['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over');}));
  ['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over');}));
</script>
</body>
</html>
