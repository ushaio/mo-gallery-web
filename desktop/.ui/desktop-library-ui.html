<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emulsion · 资源库</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --background:#fff;--foreground:#09090b;--muted:#f4f4f5;--muted-foreground:#71717a;--border:#e4e4e7;
  --primary:#18181b;--primary-foreground:#fafafa;--accent:#f4f4f5;--ring:#18181b;--destructive:#ef4444;
  --card:#fff;--radius:8px;--tile:180px;
}
.dark{
  --background:#09090b;--foreground:#fafafa;--muted:#18181b;--muted-foreground:#a1a1aa;--border:#27272a;
  --primary:#fafafa;--primary-foreground:#18181b;--accent:#27272a;--ring:#d4d4d8;--card:#09090b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:13px;line-height:1.45;background:var(--background);color:var(--foreground);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
svg{flex:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--border);border:3px solid var(--background);border-radius:8px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11.5px}
.muted{color:var(--muted-foreground)}
.num{font-variant-numeric:tabular-nums}

/* 基础组件 */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--border);background:var(--background);font-size:13px;font-weight:500;white-space:nowrap;transition:.12s}
.btn:hover{background:var(--accent)}
.btn.primary{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.btn.primary:hover{opacity:.9}
.btn.ghost{border-color:transparent}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn.sm{height:28px;padding:0 10px;font-size:12px}.btn.sm.icon{width:28px}
.btn.xs{height:24px;padding:0 8px;font-size:12px}.btn.xs.icon{width:24px}
.btn.on{background:var(--accent)}
.btn.danger{color:var(--destructive)}
.seg{display:inline-flex;background:var(--muted);padding:3px;border-radius:7px;gap:2px}
.seg button{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:5px;font-size:12.5px;font-weight:500;color:var(--muted-foreground)}
.seg button.on{background:var(--background);color:var(--foreground);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dark .seg button.on{background:#27272a}
.input{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--background);color:var(--muted-foreground)}
.input input{flex:1;border:0;outline:0;background:transparent;color:var(--foreground);min-width:0}
.input:focus-within{box-shadow:0 0 0 2px var(--background),0 0 0 4px var(--ring)}
kbd{font-family:inherit;font-size:10.5px;padding:1px 5px;border:1px solid var(--border);border-radius:4px;color:var(--muted-foreground);background:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:500;background:var(--muted);color:var(--muted-foreground)}
.badge.solid{background:var(--primary);color:var(--primary-foreground)}
.badge.outline{background:transparent;border:1px solid var(--border)}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--border);font-size:12px;color:var(--muted-foreground);transition:.12s}
.chip:hover{color:var(--foreground);background:var(--accent)}
.chip.on{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.chip .x{opacity:.6;margin-left:2px}
.sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border);display:grid;place-items:center;background:var(--background);color:var(--primary-foreground);flex:none}
.check.on{background:var(--primary);border-color:var(--primary)}
.tip{position:relative}

/* 布局 */
.app{display:grid;grid-template-columns:232px 1fr auto;grid-template-rows:52px 1fr;height:100vh}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-right:4px}
.logo .mark{width:26px;height:26px;border-radius:6px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center}
.topbar .search{flex:1;max-width:520px;margin:0 auto}
.topbar .right{display:flex;align-items:center;gap:6px;margin-left:auto}

/* 侧栏 */
.sidebar{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.sb-scroll{flex:1;overflow:auto;padding:10px 8px}
.sb-sec{margin-bottom:6px}
.sb-h{display:flex;align-items:center;gap:6px;padding:8px 8px 4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);cursor:pointer;user-select:none}
.sb-h .chev{transition:.15s}
.sb-sec.closed .chev{transform:rotate(-90deg)}
.sb-sec.closed .sb-body{display:none}
.sb-h .act{margin-left:auto;display:flex;gap:2px;opacity:0;transition:.12s}
.sb-h:hover .act{opacity:1}
.sb-h .act button{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;color:var(--muted-foreground)}
.sb-h .act button:hover{background:var(--accent);color:var(--foreground)}
.nav{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:6px;color:var(--foreground);cursor:pointer;font-size:13px;white-space:nowrap;position:relative}
.nav:hover{background:var(--accent)}
.nav.on{background:var(--accent);font-weight:500}
.nav .n{margin-left:auto;font-size:11.5px;color:var(--muted-foreground)}
.nav .ic{color:var(--muted-foreground)}.nav.on .ic{color:var(--foreground)}
.nav .tw{width:14px;height:14px;display:grid;place-items:center;color:var(--muted-foreground);border-radius:3px;margin-left:-4px}
.nav .tw:hover{background:var(--border)}
.nav.d1{padding-left:24px}.nav.d2{padding-left:40px}
.nav .dot{width:6px;height:6px;border-radius:50%;background:var(--muted-foreground);opacity:.6;margin-left:4px}
.tags{display:flex;flex-wrap:wrap;gap:4px;padding:4px 8px}
.tags .chip{height:22px;padding:0 8px;font-size:11.5px}
.typebar{margin:4px 8px 6px;height:4px;border-radius:2px;background:var(--muted);overflow:hidden;display:flex}
.typebar i{display:block;height:100%;background:var(--primary)}
.typebar i+i{background:var(--muted-foreground);opacity:.45}
.sb-foot{border-top:1px solid var(--border);padding:12px 14px;font-size:12px}
.sb-foot .row{display:flex;justify-content:space-between;align-items:center;color:var(--muted-foreground)}
.sb-foot .bar{height:5px;border-radius:3px;background:var(--muted);margin:8px 0 6px;overflow:hidden}
.sb-foot .bar i{display:block;height:100%;background:var(--primary)}
.empty{padding:6px 8px 8px;font-size:12px;color:var(--muted-foreground);display:flex;align-items:center;justify-content:space-between}
.empty button{color:var(--foreground);font-weight:500;display:inline-flex;align-items:center;gap:4px}

/* 主区 */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.toolbar{padding:10px 16px 0;border-bottom:1px solid var(--border)}
.toolbar .r1{display:flex;align-items:center;gap:8px;height:36px}
.toolbar .crumb{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600}
.toolbar .crumb .muted{font-weight:400;font-size:13px}
.toolbar .crumb a{color:var(--muted-foreground);font-weight:400;font-size:13px;cursor:pointer}
.toolbar .crumb a:hover{color:var(--foreground)}
.toolbar .r2{display:flex;align-items:center;gap:6px;height:44px;overflow-x:auto}
.toolbar .r2::-webkit-scrollbar{display:none}
.toolbar .right{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.select{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px 0 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--background);cursor:pointer}
.select:hover{background:var(--accent)}
.content{flex:1;overflow:auto;padding:0 16px 80px;min-height:0}
.folders{display:flex;align-items:center;gap:6px;padding:12px 0 4px;flex-wrap:wrap}
.folders .lbl{font-size:12px;color:var(--muted-foreground);margin-right:4px}
.fchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;cursor:pointer}
.fchip:hover{background:var(--accent)}
.fchip .n{color:var(--muted-foreground);font-size:11.5px}
.fchip .ic{color:var(--muted-foreground)}
.group{padding-top:14px}
.gh{position:sticky;top:0;z-index:5;background:var(--background);display:flex;align-items:center;gap:10px;height:32px;margin:0 -16px;padding:0 16px;font-size:12.5px;font-weight:500;border-bottom:1px solid transparent}
.gh .check{opacity:0;transition:.12s}
.group:hover .gh .check,.gh .check.on,.gh .check.part{opacity:1}
.gh .n{color:var(--muted-foreground);font-weight:400}
.gh .place{color:var(--muted-foreground);font-weight:400;display:inline-flex;align-items:center;gap:4px}
.gh .place::before{content:"·";margin-right:4px}
.check.part{background:var(--primary);border-color:var(--primary)}
.check.part::after{content:"";width:8px;height:2px;background:var(--primary-foreground);border-radius:1px}

/* 网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));gap:4px;padding-top:8px}
.tile{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--muted);cursor:pointer;user-select:none}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .2s}
.tile:hover img{opacity:.92}
.tile.sel{box-shadow:0 0 0 2px var(--background),0 0 0 4px var(--primary)}
.tile.sel img{opacity:.85}
.tile .check{position:absolute;top:8px;left:8px;z-index:3;opacity:0;transition:.12s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tile:hover .check,.tile.sel .check{opacity:1}
.tile .bd{position:absolute;top:8px;right:8px;z-index:3;display:flex;gap:4px}
.tile .bd span{height:20px;min-width:20px;padding:0 5px;border-radius:5px;background:rgba(9,9,11,.62);color:#fff;font-size:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:3px;backdrop-filter:blur(4px)}
.tile .bd span.warn{background:rgba(255,255,255,.92);color:#18181b}
.tile .cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:22px 8px 7px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));opacity:0;transition:.15s;display:flex;justify-content:space-between;gap:8px}
.tile .cap b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .cap span{opacity:.75;flex:none}
.tile:hover .cap{opacity:1}
.tile .fav{position:absolute;left:8px;bottom:8px;z-index:3;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.tile.film::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;border:2px solid rgba(255,255,255,.35);border-radius:6px;mix-blend-mode:overlay}
/* 原比例 */
.just{display:flex;flex-wrap:wrap;gap:4px;padding-top:8px}
.just .tile{aspect-ratio:auto;height:var(--tile);flex-grow:calc(var(--r)*100);width:calc(var(--tile)*var(--r))}
.just::after{content:"";flex-grow:1e5}
/* 列表 */
.list{padding-top:6px}
.lrow{display:grid;grid-template-columns:28px 44px minmax(180px,2fr) 70px 90px 120px 130px 90px 1fr;align-items:center;gap:12px;height:48px;padding:0 6px;border-radius:6px;cursor:pointer;font-size:12.5px;user-select:none}
.lrow:hover{background:var(--accent)}
.lrow.sel{background:var(--accent);box-shadow:inset 2px 0 0 var(--primary)}
.lrow img{width:44px;height:36px;object-fit:cover;border-radius:4px;background:var(--muted)}
.lrow .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.lrow .name small{display:block;font-weight:400;color:var(--muted-foreground);font-size:11px}
.lhead{display:grid;grid-template-columns:28px 44px minmax(180px,2fr) 70px 90px 120px 130px 90px 1fr;gap:12px;padding:8px 6px;font-size:11px;color:var(--muted-foreground);border-bottom:1px solid var(--border);position:sticky;top:32px;background:var(--background);z-index:4}
.lrow .check{opacity:1}

/* 状态栏 / 批量条 */
.statusbar{height:36px;border-top:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 16px;font-size:12px;color:var(--muted-foreground)}
.statusbar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.statusbar a{color:var(--muted-foreground);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.statusbar a:hover{color:var(--foreground)}
.zoom{display:flex;align-items:center;gap:6px}
.zoom input{width:110px;accent-color:var(--primary)}
.selbar{position:absolute;left:50%;bottom:52px;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:.18s;z-index:20;display:flex;align-items:center;gap:4px;padding:6px 6px 6px 14px;background:var(--primary);color:var(--primary-foreground);border-radius:10px;box-shadow:0 12px 32px -8px rgba(0,0,0,.35)}
.selbar.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.selbar b{font-weight:600;margin-right:8px}
.selbar .btn{border-color:transparent;background:transparent;color:inherit;height:30px}
.selbar .btn:hover{background:rgba(255,255,255,.14)}
.dark .selbar .btn:hover{background:rgba(0,0,0,.1)}
.selbar .sep{background:rgba(255,255,255,.2)}
.dark .selbar .sep{background:rgba(0,0,0,.15)}

/* 右栏 */
.inspector{width:320px;border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;transition:width .2s}
.inspector.hide{width:0;overflow:hidden;border:0}
.ins-scroll{flex:1;overflow:auto;min-height:0}
.preview{margin:14px 14px 0;aspect-ratio:4/3;border-radius:8px;background:var(--muted);display:grid;place-items:center;overflow:hidden;position:relative}
.preview img{max-width:100%;max-height:100%;object-fit:contain}
.preview .zoomin{position:absolute;right:8px;bottom:8px}
.ins-title{padding:12px 14px 0}
.ins-title .name{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;word-break:break-all}
.ins-title .name .edit{opacity:0;color:var(--muted-foreground)}
.ins-title .name:hover .edit{opacity:1}
.ins-title .sub{display:flex;align-items:center;gap:6px;margin-top:3px;color:var(--muted-foreground)}
.ins-title .sub button{color:var(--muted-foreground);display:inline-flex}
.quick{display:flex;align-items:center;gap:2px;padding:10px 12px;border-bottom:1px solid var(--border);margin-top:8px}
.stars{display:flex;gap:1px;margin:0 6px}
.stars button{color:var(--border);display:grid;place-items:center;width:20px;height:24px}
.stars button.on{color:var(--foreground)}
.stars button:hover{color:var(--foreground)}
.labels{display:flex;gap:4px;margin:0 6px}
.labels button{width:14px;height:14px;border-radius:50%;opacity:.35;transition:.12s;border:2px solid transparent}
.labels button:hover,.labels button.on{opacity:1}
.labels button.on{box-shadow:0 0 0 2px var(--background),0 0 0 3.5px var(--foreground)}
.sync{margin:12px 14px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;gap:10px}
.sync .t{flex:1;min-width:0}
.sync .t b{display:block;font-weight:500;font-size:12.5px}
.sync .t small{display:block;color:var(--muted-foreground);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync .st{width:28px;height:28px;border-radius:6px;background:var(--muted);display:grid;place-items:center;color:var(--muted-foreground)}
.sync.ok .st{background:var(--primary);color:var(--primary-foreground)}
.sec{border-top:1px solid var(--border)}
.sec-h{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;font-weight:600;font-size:12.5px;cursor:pointer;user-select:none}
.sec-h .chev{margin-left:auto;color:var(--muted-foreground);transition:.15s}
.sec.closed .chev{transform:rotate(-90deg)}
.sec.closed .sec-b{display:none}
.sec-h .ic{color:var(--muted-foreground)}
.sec-b{padding:0 14px 12px}
.kv{display:grid;grid-template-columns:76px 1fr;gap:6px 12px;font-size:12.5px}
.kv dt{color:var(--muted-foreground)}
.kv dd{display:flex;align-items:center;gap:6px;min-width:0}
.kv dd .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv dd button{color:var(--muted-foreground);opacity:0;display:inline-flex}
.kv dd:hover button{opacity:1}
.kv2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv2 div{padding:8px 10px;border:1px solid var(--border);border-radius:6px}
.kv2 small{display:block;color:var(--muted-foreground);font-size:11px}
.kv2 b{font-weight:500;font-size:12.5px}
.palette{display:flex;gap:3px;height:22px;border-radius:5px;overflow:hidden}
.palette i{flex:1}
.tagrow{display:flex;flex-wrap:wrap;gap:4px}
.tagrow .chip{height:24px;padding:0 9px;font-size:12px}
.tagrow .chip.add{border-style:dashed;color:var(--muted-foreground)}
.ins-foot{border-top:1px solid var(--border);padding:10px 12px;display:flex;gap:6px}
.ins-foot .btn{flex:1;justify-content:center}
.multi{padding:14px}
.multi .stack{height:140px;position:relative;margin:6px 10px 18px}
.multi .stack img{position:absolute;width:70%;height:100%;object-fit:cover;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.15);border:2px solid var(--background)}
.multi h3{font-size:15px;font-weight:600}
.multi .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px}
.multi .acts .btn{justify-content:flex-start}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);opacity:0;transition:.2s;background:var(--primary);color:var(--primary-foreground);padding:9px 14px;border-radius:8px;font-size:12.5px;z-index:99;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hint{padding:60px 0;text-align:center;color:var(--muted-foreground)}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="logo"><span class="mark" id="logoIc"></span>资源库</div>
    <div class="seg" id="scopeSeg">
      <button data-scope="cloud" class="on"></button>
      <button data-scope="local"></button>
    </div>
    <div class="input search" id="searchBox"><span id="searchIc"></span><input id="search" placeholder="搜索文件名、路径、标签、相机…"><kbd>⌘K</kbd></div>
    <div class="right" id="topActions"></div>
  </header>

  <aside class="sidebar">
    <div class="sb-scroll" id="sidebar"></div>
    <div class="sb-foot" id="sbFoot"></div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <div class="r1" id="crumb"></div>
      <div class="r2" id="filters"></div>
    </div>
    <div class="content" id="content"></div>
    <div class="selbar" id="selbar"></div>
    <div class="statusbar" id="statusbar"></div>
  </main>

  <aside class="inspector" id="inspector"></aside>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- icons (lucide) ---------- */
const I={
search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
cloud:'<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
cloudoff:'<path d="m2 2 20 20"/><path d="M5.782 5.782A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.307-.193"/><path d="M21.532 16.5A4.5 4.5 0 0 0 17.5 10h-1.79A7.008 7.008 0 0 0 10 5.07"/>',
drive:'<line x1="22" x2="2" y1="12" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" x2="6.01" y1="16" y2="16"/><line x1="10" x2="10.01" y1="16" y2="16"/>',
filter:'<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',

function gen(scope){
  const dates=[['2026-08-14',12],['2026-08-13',7],['2026-08-09',9],['2026-07-30',6],['2026-06-21',5]];
  const out=[];let k=0;
  dates.forEach(([d,n],di)=>{for(let i=0;i<n;i++){
    const r=seed(k*3+ (scope==='cloud'?1:2));const ratio=RAT[Math.floor(r*RAT.length)];
    const film=seed(k*7+11)<(scope==='cloud'?.28:.18);
    const cam=film?FILMS[k%3]:CAMS[k%4];
    const fmt=film?'TIF':seed(k*5+3)<.15?'WEBP':seed(k*5+4)<.1?'HEIC':'JPG';
    const w=ratio[0]*(film?900:1365),h=ratio[1]*(film?900:1365);
    const name=scope==='cloud'?(film?`scan_${String(k+7).padStart(3,'0')}.tif`:`DSC0${4471+k}.jpg`):(film?`000168930${30+k}.jpg`:fmt==='WEBP'?`59a81fbd517b${k}.webp`:seed(k)<.3?`微信图片_2026081${i}.jpg`:`IMG_2026081${i}_${100+k}.jpg`);
    out.push({id:`${scope}-${k}`,seed:SEEDS[k%SEEDS.length],name,date:d,time:`${9+((k*3)%10)}:${String((k*17)%60).padStart(2,'0')}`,w,h,r:ratio[0]/ratio[1],type:film?'film':'digital',fmt,
      size:(seed(k*13)*8+1.2).toFixed(1),synced:scope==='cloud'?true:seed(k*19)<.35,localCopy:scope==='cloud'?seed(k*23)<.4:true,live:!film&&seed(k*29)<.15,
      fav:seed(k*31)<.18,rating:seed(k*37)<.5?0:Math.ceil(seed(k*41)*5),hidden:seed(k*43)<.08,label:seed(k*47)<.2?Math.floor(seed(k*53)*6):-1,
      cam,place:PLACES[(k+di)%PLACES.length],pal:PAL[k%3],tags:k%4===0?['Story','灵隐寺']:k%3===0?['OPPO']:[],albums:k%5===0?['杭州']:[],
      path:scope==='cloud'?`2026/mo-gallery/${d.replace(/-/g,'')}/${name}`:`E:\\图片\\2026\\${d.slice(5,7)}\\${name}`});
    k++;}});
  return out;
}

function visible(){
  const F=S.filters;let P=photos().filter(p=>{
    if(S.nav==='film'||F.type==='film')if(p.type!=='film')return false;
    if(S.nav==='digital'||F.type==='digital')if(p.type!=='digital')return false;
    if(S.nav==='fav'||F.fav)if(!p.fav)return false;
    if(S.nav==='hidden'){if(!p.hidden)return false}else if(!F.hidden&&p.hidden)return false;
    if(S.nav==='live'||F.live)if(!p.live)return false;
    if(S.nav==='unsynced'||F.sync==='0')if(p.synced)return false;
    if(F.sync==='1'&&!p.synced)return false;
    if(S.nav==='nolocal'||F.local==='0')if(p.localCopy)return false;
    if(F.local==='1'&&!p.localCopy)return false;
    if(F.fmt&&p.fmt!==F.fmt)return false;
    if(F.rating&&p.rating<+F.rating)return false;
    if(S.nav==='trash'||S.nav==='lost')return false;
    return true;
  });
  P.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)*(S.desc?-1:1));
  return P;
}

      g.items.forEach(p=>{h+=`<div class="lrow ${S.sel.has(p.id)?'sel':''}" data-id="${p.id}"><span class="check ${S.sel.has(p.id)?'on':''}">${S.sel.has(p.id)?ic('check',10):''}</span><img src="${img(p,120)}" loading="lazy"><div class="name">${p.name}<small>${p.place}${p.fav?' · ♥':''}${p.rating?' · '+'★'.repeat(p.rating):''}</small></div><span class="badge outline">${p.fmt}</span><span class="num muted">${p.w} × ${p.h}</span><span class="num muted">${p.date.replace(/-/g,'/')} ${p.time}</span><span class="muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${S.scope==='cloud'?(p.type==='film'?p.cam[2]+' · '+p.cam[3]:p.cam[0]):p.path.replace(/\\[^\\]+$/,'')}</span><span class="num muted">${p.size} MB</span><span class="muted" style="display:inline-flex;align-items:center;gap:4px">${S.scope==='cloud'?(p.localCopy?ic('check',12)+'有副本':ic('cloud',12)+'仅云端'):(p.synced?ic('check',12)+'已上传':ic('cloudoff',12)+'未上传')}</span></div>`});
      h+=`</div></div>`});
  }else{
    groups.forEach(g=>{h+=`<div class="group"><div class="gh" data-g="${g.d}"><span class="check"></span>${fmtDate(g.d)}<span class="n num">${g.items.length} 张</span><span class="place">${ic('pin',11)}${g.place}</span></div><div class="${S.view==='grid'?'grid':'just'}">`;

function onSelect(id,e){
  const flat=visible().map(p=>p.id);
  if(e.shiftKey&&S.last){const a=flat.indexOf(S.last),b=flat.indexOf(id);flat.slice(Math.min(a,b),Math.max(a,b)+1).forEach(i=>S.sel.add(i))}
  else if(e.metaKey||e.ctrlKey){S.sel.has(id)?S.sel.delete(id):S.sel.add(id)}
  else{if(S.sel.size===1&&S.sel.has(id))S.sel.clear();else{S.sel.clear();S.sel.add(id)}}
  S.last=id;afterSel();
}
function afterSel(){
  $$('#content [data-id]').forEach(t=>{const on=S.sel.has(t.dataset.id);t.classList.toggle('sel',on);const c=t.querySelector('.check');c.classList.toggle('on',on);c.innerHTML=on?ic('check',10):''});
  $$('#content .gh').forEach(g=>{const ids=[...g.nextElementSibling.querySelectorAll('[data-id]')].map(x=>x.dataset.id);const all=ids.every(i=>S.sel.has(i)),some=ids.some(i=>S.sel.has(i));const ck=g.querySelector('.check');ck.classList.toggle('on',all);ck.classList.toggle('part',some&&!all);ck.innerHTML=all?ic('check',10):''});
  renderSelbar();renderInspector();renderStatus();
}

  el.querySelectorAll('[data-label]').forEach(b=>b.onclick=()=>{p.label=p.label===+b.dataset.label?-1:+b.dataset.label;renderInspector()});
  el.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{p[b.dataset.q]=!p[b.dataset.q];renderInspector();renderContent();toast(b.dataset.q==='fav'?(p.fav?'已加入精选':'已取消精选'):(p.hidden?'已隐藏，在「隐藏」中可找回':'已取消隐藏'))});
  el.querySelectorAll('[title="复制"]').forEach(b=>b.onclick=()=>toast('已复制'));
}

/* ---------- 全局 ---------- */
document.addEventListener('keydown',e=>{
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus()}
  if(mod&&e.key.toLowerCase()==='a'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();visible().forEach(p=>S.sel.add(p.id));afterSel()}
  if(mod&&e.key.toLowerCase()==='i'){e.preventDefault();$('#inspBtn').click()}
  if(e.key==='Escape'){S.sel.clear();afterSel();document.activeElement.blur()}
  if(e.key==='1'&&!mod&&document.activeElement.tagName!=='INPUT')$$('#scopeSeg button')[0].click();
  if(e.key==='2'&&!mod&&document.activeElement.tagName!=='INPUT')$$('#scopeSeg button')[1].click();
});
$('#search').oninput=e=>{const q=e.target.value.trim().toLowerCase();$$('#content [data-id]').forEach(t=>{const p=photos().find(x=>x.id===t.dataset.id);t.style.display=!q||(p.name+p.place+p.cam.join()+p.path).toLowerCase().includes(q)?'':'none'})};
function renderAll(){renderTop();renderSidebar();renderCrumb();renderFilters();renderContent();renderInspector();renderSelbar()}
renderAll();
</script>
</body>
</html>
