<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MO Gallery Desktop</title>
    <script>
      // 全局错误捕获 — 渲染崩溃时显示错误而非空白页
      window.__showErr = function (label, error) {
        var r = document.getElementById('root');
        if (!r || r.hasChildNodes()) return;
        // webview 刷新后 Wails 运行时（window.go）未注入：展示可恢复的提示页，而不是原始堆栈
        if (typeof window.go === 'undefined') {
          r.innerHTML =
            '<div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:system-ui,-apple-system,sans-serif">' +
            '<div style="font-size:15px;font-weight:600;color:#18181b">桌面运行时未就绪</div>' +
            '<div style="font-size:13px;color:#71717a;max-width:420px;text-align:center">Wails 运行时尚未注入，请返回应用入口重新建立桌面连接。</div>' +
            '<button onclick="location.pathname === \'/\' ? location.reload() : location.replace(\'/#\' + location.pathname + location.search)" style="padding:8px 20px;border:none;border-radius:8px;font-size:13px;cursor:pointer;background:#2563eb;color:#fff">重新加载</button>' +
            '</div>';
          return;
        }
        var msg = error && error.stack ? error.stack : String(error);
        r.innerHTML =
          '<div style="padding:24px;font-family:Consolas,monospace;font-size:13px;color:#dc2626;white-space:pre-wrap;word-break:break-word;max-width:960px">' +
          '<b style="font-size:15px;display:block;margin-bottom:12px">' + label + '</b>' +
          msg.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') +
          '</div>';
      };
      window.addEventListener('error', function (e) {
        window.__showErr('JS 运行时错误', e.error || e.message);
      });
      window.addEventListener('unhandledrejection', function (e) {
        window.__showErr('未处理 Promise 错误', e.reason);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
