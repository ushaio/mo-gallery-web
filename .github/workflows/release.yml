  #       working-directory: flutter
  #       run: flutter build apk --release
  #
  #     - name: Upload Android artifact
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: mo-gallery-mobile-android-${{ needs.prepare.outputs.tag }}
  #         path: flutter/build/app/outputs/flutter-apk/app-release.apk
  #         if-no-files-found: error

  publish:
    needs:
      - prepare
      - desktop-windows-build
      - desktop-macos-build
      - desktop-linux-build
      # - flutter-android-build
    if: needs.prepare.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mo-gallery-desktop-*-${{ needs.prepare.outputs.tag }}
          path: release-assets
          merge-multiple: true

      # - name: Download Android artifact
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: mo-gallery-mobile-android-${{ needs.prepare.outputs.tag }}
      #     path: release-assets

      - name: Verify release assets
        run: |
          expected_assets=(
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-windows-amd64-portable.exe"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-windows-amd64-setup.exe"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-windows-arm64-portable.exe"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-windows-arm64-setup.exe"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-macos-amd64.zip"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-macos-arm64.zip"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-macos-universal.zip"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-linux-amd64.tar.gz"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-linux-arm64.tar.gz"
          )
          for asset in "${expected_assets[@]}"; do
            if [ ! -f "release-assets/$asset" ]; then
              echo "Missing release asset: $asset" >&2
              exit 1
            fi
          done

      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.prepare.outputs.tag }}"
          git push origin "${{ needs.prepare.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          body_path: RELEASE.md
          files: release-assets/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
