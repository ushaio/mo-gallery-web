name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.TAG }}
      version: ${{ steps.version.outputs.VERSION }}
      tag_exists: ${{ steps.check_tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract latest version from RELEASE.md
        id: version
        run: |
          VERSION=$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' RELEASE.md | sed -E 's/^## //')
          if [ -z "$VERSION" ]; then
            echo "Could not find a release heading like '## v1.2.3' in RELEASE.md" >&2
            exit 1
          fi
          echo "TAG=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Validate release versions
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const expected = process.env.RELEASE_VERSION
          const readJson = (path) => JSON.parse(fs.readFileSync(path, 'utf8'))
          const checks = [
            ['package.json', readJson('package.json').version],
            ['desktop/frontend/package.json', readJson('desktop/frontend/package.json').version],
            ['desktop/wails.json info.productVersion', readJson('desktop/wails.json').info?.productVersion],
          ]

          // Flutter pubspec uses `x.y.z+build`; compare the version part only.
          const pubspec = fs.readFileSync('flutter/pubspec.yaml', 'utf8')
          const flutterVersion = pubspec.match(/^version:\s*(.+)\s*$/m)?.[1]?.trim()
          checks.push(['flutter/pubspec.yaml', flutterVersion?.split('+')[0]])

          const mismatches = checks.filter(([, actual]) => actual !== expected)
          if (mismatches.length > 0) {
            for (const [label, actual] of mismatches) {
              console.error(`${label} (${actual ?? 'missing'}) must match RELEASE.md (${expected})`)
            }
            console.error('Update Web/Desktop versions and RELEASE.md on dev, then merge dev into master to release.')
            process.exit(1)
          }
          NODE

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.version.outputs.TAG }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  node-runtime:
    needs: prepare
    if: needs.prepare.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_RUNTIME_PRIVATE_KEY: ${{ secrets.NODE_RUNTIME_PRIVATE_KEY }}
      PLUGIN_SIGNING_PUBLIC_KEY: ${{ secrets.PLUGIN_SIGNING_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install archive utilities
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate release signing configuration
        run: |
          test -n "$NODE_RUNTIME_PRIVATE_KEY" || { echo 'NODE_RUNTIME_PRIVATE_KEY secret is required'; exit 1; }
          test -n "$PLUGIN_SIGNING_PUBLIC_KEY" || { echo 'PLUGIN_SIGNING_PUBLIC_KEY secret is required'; exit 1; }

      - name: Fetch, verify and sign bundled Node runtime
        run: |
          printf '%s' "$NODE_RUNTIME_PRIVATE_KEY" > "$RUNNER_TEMP/node-runtime-private.pem"
          printf '%s' "$PLUGIN_SIGNING_PUBLIC_KEY" > "$RUNNER_TEMP/plugin-signing-public.pem"
          node desktop/build/fetch-node-runtime.mjs \
            --private-key "$RUNNER_TEMP/node-runtime-private.pem" \
            --plugin-public-key "$RUNNER_TEMP/plugin-signing-public.pem" \
            --plugin-public-key-output desktop/build/generated/plugin-signing-public-key.b64 \
            --output-root desktop/storage_plugins/runtime_assets \
            --public-key-output desktop/build/generated/node-runtime-public-key.b64

      - name: Stage runtime bundle artifact
        run: |
          mkdir -p desktop/build/runtime-package
          cp -R desktop/storage_plugins/runtime_assets desktop/build/runtime-package/runtime_assets
          cp desktop/build/generated/*.b64 desktop/build/runtime-package/

      - name: Upload runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: mo-gallery-node-runtime-${{ needs.prepare.outputs.tag }}
          path: desktop/build/runtime-package
          if-no-files-found: error

  desktop-windows-build:
    needs:
      - prepare
      - node-runtime
    if: needs.prepare.outputs.tag_exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          # 386 and arm64 are temporarily excluded until their Go/CGO dependency toolchains are supported.
          - arch: amd64
            platform: windows/amd64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: desktop/go.sum

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
          $goBin = Join-Path (go env GOPATH) 'bin'
          $goBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $goBin 'wails.exe') version

      - name: Install desktop frontend dependencies
        run: pnpm --filter mo-gallery-desktop-frontend install --no-frozen-lockfile --config.production=false

      - name: Verify desktop frontend dependencies
        working-directory: desktop/frontend
        run: pnpm list react-router-dom sonner

      - name: Download verified Node runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: mo-gallery-node-runtime-${{ needs.prepare.outputs.tag }}
          path: desktop/build/runtime-package

      - name: Install runtime bundle and trust keys
        working-directory: desktop
        shell: pwsh
        run: |
          Copy-Item 'build/runtime-package/runtime_assets/*' 'storage_plugins/runtime_assets' -Recurse -Force
          $runtimeKey = (Get-Content 'build/runtime-package/node-runtime-public-key.b64' -Raw).Trim()
          $pluginKey = (Get-Content 'build/runtime-package/plugin-signing-public-key.b64' -Raw).Trim()
          "NODE_RUNTIME_PUBLIC_KEY=$runtimeKey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PLUGIN_SIGNING_PUBLIC_KEY=$pluginKey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $makensis) {
            choco install nsis -y --no-progress
          }

          $candidatePaths = @(
            'C:\Program Files (x86)\NSIS',
            'C:\Program Files\NSIS'
          )
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if ($makensis) {
            $candidatePaths += Split-Path $makensis.Source
          }

          $nsisPath = $candidatePaths |
            Select-Object -Unique |
            Where-Object { Test-Path (Join-Path $_ 'makensis.exe') } |
            Select-Object -First 1
          if (-not $nsisPath) {
            throw 'makensis.exe was not found on the Windows runner.'
          }
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build portable executable and NSIS installer
        working-directory: desktop
        shell: pwsh
        run: wails build -clean -nsis -platform ${{ matrix.platform }} -ldflags "-X mo-gallery-desktop/storage_plugins.BundledNodeRuntimePublicKey=$env:NODE_RUNTIME_PUBLIC_KEY -X mo-gallery-desktop/storage_plugins.BundledPluginSigningPublicKey=$env:PLUGIN_SIGNING_PUBLIC_KEY"

      - name: Normalize Windows artifact names
        working-directory: desktop
        shell: pwsh
        run: |
          $destination = Join-Path $PWD 'release-assets'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null

          $installer = Get-ChildItem 'build/bin' -File -Filter '*-installer.exe' | Select-Object -First 1
          $portable = Get-ChildItem 'build/bin' -File -Filter '*.exe' |
            Where-Object { -not $installer -or $_.FullName -ne $installer.FullName } |
            Select-Object -First 1

          if (-not $portable -or -not $installer) {
            Get-ChildItem 'build/bin' -Recurse | Select-Object FullName
            throw 'Expected both a portable executable and an NSIS installer.'
          }

          $baseName = 'mo-gallery-desktop-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}'
          Copy-Item $portable.FullName (Join-Path $destination "$baseName-portable.exe")
          Copy-Item $installer.FullName (Join-Path $destination "$baseName-setup.exe")

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mo-gallery-desktop-windows-${{ matrix.arch }}-${{ needs.prepare.outputs.tag }}
          path: desktop/release-assets/*.exe
          if-no-files-found: error

  desktop-macos-build:
    needs:
      - prepare
      - node-runtime
    if: needs.prepare.outputs.tag_exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: darwin/amd64
            runner: macos-15-intel
          - arch: arm64
            platform: darwin/arm64
            runner: macos-15
          - arch: universal
            platform: darwin/universal
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: desktop/go.sum

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/wails" version

      - name: Install desktop frontend dependencies
        run: pnpm --filter mo-gallery-desktop-frontend install --no-frozen-lockfile --config.production=false

      - name: Verify desktop frontend dependencies
        working-directory: desktop/frontend
        run: pnpm list react-router-dom sonner

      - name: Download verified Node runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: mo-gallery-node-runtime-${{ needs.prepare.outputs.tag }}
          path: desktop/build/runtime-package

      - name: Install runtime bundle and trust keys
        working-directory: desktop
        run: |
          cp -R build/runtime-package/runtime_assets/. storage_plugins/runtime_assets/
          echo "NODE_RUNTIME_PUBLIC_KEY=$(tr -d '\\r\\n' < build/runtime-package/node-runtime-public-key.b64)" >> "$GITHUB_ENV"
          echo "PLUGIN_SIGNING_PUBLIC_KEY=$(tr -d '\\r\\n' < build/runtime-package/plugin-signing-public-key.b64)" >> "$GITHUB_ENV"

      - name: Import Apple signing certificate
        if: ${{ env.MACOS_CERTIFICATE_P12_BASE64 != '' && env.MACOS_CERTIFICATE_PASSWORD != '' && env.MACOS_SIGNING_IDENTITY != '' }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/mo-gallery-build.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/mo-gallery-signing.p12"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build macOS application
        working-directory: desktop
        run: wails build -clean -platform ${{ matrix.platform }} -ldflags "-X mo-gallery-desktop/storage_plugins.BundledNodeRuntimePublicKey=$NODE_RUNTIME_PUBLIC_KEY -X mo-gallery-desktop/storage_plugins.BundledPluginSigningPublicKey=$PLUGIN_SIGNING_PUBLIC_KEY"

      - name: Sign macOS application
        if: ${{ env.MACOS_SIGNING_IDENTITY != '' && env.MACOS_CERTIFICATE_P12_BASE64 != '' }}
        working-directory: desktop
        run: codesign --deep --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" build/bin/mo-gallery-desktop.app

      - name: Notarize macOS application bundle
        if: ${{ env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.MACOS_SIGNING_IDENTITY != '' && env.MACOS_CERTIFICATE_P12_BASE64 != '' }}
        working-directory: desktop
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/bin/mo-gallery-desktop.app "$RUNNER_TEMP/mo-gallery-notarization.zip"
          xcrun notarytool submit "$RUNNER_TEMP/mo-gallery-notarization.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple build/bin/mo-gallery-desktop.app

      - name: Archive macOS application bundle
        working-directory: desktop
        run: |
          APP_PATH='build/bin/mo-gallery-desktop.app'
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected application bundle not found: $APP_PATH" >&2
            exit 1
          fi
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" \
            "release-assets/mo-gallery-desktop-${{ needs.prepare.outputs.version }}-macos-${{ matrix.arch }}.zip"
          DMG_ROOT="$RUNNER_TEMP/mo-gallery-dmg-root"
          rm -rf "$DMG_ROOT"
          mkdir -p "$DMG_ROOT"
          ditto "$APP_PATH" "$DMG_ROOT/MO Gallery Desktop.app"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create -volname "MO Gallery Desktop" -srcfolder "$DMG_ROOT" -ov -format UDZO \
            "release-assets/mo-gallery-desktop-${{ needs.prepare.outputs.version }}-macos-${{ matrix.arch }}.dmg"
          PKG_PATH="release-assets/mo-gallery-desktop-${{ needs.prepare.outputs.version }}-macos-${{ matrix.arch }}.pkg"
          if [ -n "$MACOS_INSTALLER_IDENTITY" ] && [ -n "$MACOS_CERTIFICATE_P12_BASE64" ]; then
            pkgbuild --component "$APP_PATH" --install-location /Applications --sign "$MACOS_INSTALLER_IDENTITY" "$PKG_PATH"
          else
            pkgbuild --component "$APP_PATH" --install-location /Applications "$PKG_PATH"
          fi

      - name: Notarize macOS distributables
        if: ${{ env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.MACOS_SIGNING_IDENTITY != '' && env.MACOS_INSTALLER_IDENTITY != '' && env.MACOS_CERTIFICATE_P12_BASE64 != '' }}
        working-directory: desktop
        run: |
          for artifact in release-assets/*.dmg release-assets/*.pkg; do
            xcrun notarytool submit "$artifact" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait
            xcrun stapler staple "$artifact"
          done

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mo-gallery-desktop-macos-${{ matrix.arch }}-${{ needs.prepare.outputs.tag }}
          path: |
            desktop/release-assets/*.zip
            desktop/release-assets/*.dmg
            desktop/release-assets/*.pkg
          if-no-files-found: error

  desktop-linux-build:
    needs:
      - prepare
      - node-runtime
    if: needs.prepare.outputs.tag_exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            deb_arch: amd64
            rpm_arch: x86_64
            appimage_arch: x86_64
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
            appimage_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev dpkg-dev rpm curl file

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: desktop/go.sum

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/wails" version

      - name: Install desktop frontend dependencies
        run: pnpm --filter mo-gallery-desktop-frontend install --no-frozen-lockfile --config.production=false

      - name: Verify desktop frontend dependencies
        working-directory: desktop/frontend
        run: pnpm list react-router-dom sonner

      - name: Download verified Node runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: mo-gallery-node-runtime-${{ needs.prepare.outputs.tag }}
          path: desktop/build/runtime-package

      - name: Install runtime bundle and trust keys
        working-directory: desktop
        run: |
          cp -R build/runtime-package/runtime_assets/. storage_plugins/runtime_assets/
          echo "NODE_RUNTIME_PUBLIC_KEY=$(tr -d '\\r\\n' < build/runtime-package/node-runtime-public-key.b64)" >> "$GITHUB_ENV"
          echo "PLUGIN_SIGNING_PUBLIC_KEY=$(tr -d '\\r\\n' < build/runtime-package/plugin-signing-public-key.b64)" >> "$GITHUB_ENV"

      - name: Build Linux application
        working-directory: desktop
        run: wails build -clean -platform ${{ matrix.platform }} -tags webkit2_41 -ldflags "-X mo-gallery-desktop/storage_plugins.BundledNodeRuntimePublicKey=$NODE_RUNTIME_PUBLIC_KEY -X mo-gallery-desktop/storage_plugins.BundledPluginSigningPublicKey=$PLUGIN_SIGNING_PUBLIC_KEY"

      - name: Archive Linux executable
        working-directory: desktop
        run: |
          BINARY_PATH='build/bin/mo-gallery-desktop'
          if [ ! -f "$BINARY_PATH" ]; then
            echo "Expected executable not found: $BINARY_PATH" >&2
            exit 1
          fi
          mkdir -p release-assets/package
          install -m 0755 "$BINARY_PATH" release-assets/package/mo-gallery-desktop
          tar -C release-assets/package -czf \
            "release-assets/mo-gallery-desktop-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}.tar.gz" \
            mo-gallery-desktop

          PACKAGE_VERSION='${{ needs.prepare.outputs.version }}'
          DEB_VERSION="${PACKAGE_VERSION/-/~}"
          RPM_VERSION="${PACKAGE_VERSION//-/_}"
          DEB_ARCH='${{ matrix.deb_arch }}'
          DEB_ROOT="release-assets/deb-root"
          mkdir -p "$DEB_ROOT/usr/bin" "$DEB_ROOT/usr/share/applications" "$DEB_ROOT/usr/share/icons/hicolor/512x512/apps" "$DEB_ROOT/DEBIAN"
          install -m 0755 "$BINARY_PATH" "$DEB_ROOT/usr/bin/mo-gallery-desktop"
          install -m 0644 build/appicon.png "$DEB_ROOT/usr/share/icons/hicolor/512x512/apps/mo-gallery-desktop.png"
          cat > "$DEB_ROOT/usr/share/applications/mo-gallery-desktop.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=MO Gallery Desktop
          Exec=mo-gallery-desktop
          Icon=mo-gallery-desktop
          Type=Application
          Categories=Graphics;Photography;
          DESKTOP
          cat > "$DEB_ROOT/DEBIAN/control" <<CONTROL
          Package: mo-gallery-desktop
          Version: $DEB_VERSION
          Section: graphics
          Priority: optional
          Architecture: $DEB_ARCH
          Depends: libgtk-3-0 | libgtk-3-0t64, libwebkit2gtk-4.1-0
          Maintainer: MO Gallery <admin@mo.gallery>
          Description: MO Gallery Desktop administration client
          CONTROL
          dpkg-deb --build "$DEB_ROOT" "release-assets/mo-gallery-desktop-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}.deb"

          RPM_ARCH='${{ matrix.rpm_arch }}'
          RPM_TOP="$PWD/release-assets/rpm"
          mkdir -p "$RPM_TOP/BUILD" "$RPM_TOP/RPMS/$RPM_ARCH" "$RPM_TOP/SOURCES" "$RPM_TOP/SPECS" "$RPM_TOP/SRPMS"
          mkdir -p release-assets/rpm-root/usr/bin release-assets/rpm-root/usr/share/applications release-assets/rpm-root/usr/share/icons/hicolor/512x512/apps
          install -m 0755 "$BINARY_PATH" release-assets/rpm-root/usr/bin/mo-gallery-desktop
          install -m 0644 build/appicon.png release-assets/rpm-root/usr/share/icons/hicolor/512x512/apps/mo-gallery-desktop.png
          cp "$DEB_ROOT/usr/share/applications/mo-gallery-desktop.desktop" release-assets/rpm-root/usr/share/applications/
          tar -C release-assets -czf "$RPM_TOP/SOURCES/mo-gallery-desktop.tar.gz" rpm-root
          cat > "$RPM_TOP/SPECS/mo-gallery-desktop.spec" <<SPEC
          Name: mo-gallery-desktop
          Version: $RPM_VERSION
          Release: 1
          Summary: MO Gallery Desktop administration client
          License: Proprietary
          Source0: mo-gallery-desktop.tar.gz
          BuildArch: $RPM_ARCH
          Requires: gtk3
          Requires: webkit2gtk4.1
          %description
          MO Gallery Desktop administration client.
          %prep
          %setup -q -n rpm-root
          %install
          mkdir -p %{buildroot}
          cp -a usr %{buildroot}/
          %files
          /usr/bin/mo-gallery-desktop
          /usr/share/applications/mo-gallery-desktop.desktop
          /usr/share/icons/hicolor/512x512/apps/mo-gallery-desktop.png
          SPEC
          rpmbuild --define "_topdir $RPM_TOP" -bb "$RPM_TOP/SPECS/mo-gallery-desktop.spec"
          cp "$RPM_TOP/RPMS/$RPM_ARCH/"*.rpm "release-assets/mo-gallery-desktop-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}.rpm"

          APPDIR="$PWD/release-assets/mo-gallery-desktop.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/512x512/apps"
          install -m 0755 "$BINARY_PATH" "$APPDIR/usr/bin/mo-gallery-desktop"
          install -m 0644 build/appicon.png "$APPDIR/mo-gallery-desktop.png"
          install -m 0644 build/appicon.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/mo-gallery-desktop.png"
          install -m 0644 "$DEB_ROOT/usr/share/applications/mo-gallery-desktop.desktop" "$APPDIR/mo-gallery-desktop.desktop"
          install -m 0644 "$DEB_ROOT/usr/share/applications/mo-gallery-desktop.desktop" "$APPDIR/usr/share/applications/mo-gallery-desktop.desktop"
          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$HERE/usr/bin/mo-gallery-desktop" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"
          LINUXDEPLOY_ARCH='${{ matrix.appimage_arch }}'
          curl -fL "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${LINUXDEPLOY_ARCH}.AppImage" -o linuxdeploy.AppImage
          chmod +x linuxdeploy.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy.AppImage --appdir "$APPDIR" --output appimage
          APPIMAGE_PATH=$(find . -maxdepth 1 -name '*.AppImage' -not -name 'linuxdeploy.AppImage' -print -quit)
          test -n "$APPIMAGE_PATH"
          mv "$APPIMAGE_PATH" "release-assets/mo-gallery-desktop-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}.AppImage"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: mo-gallery-desktop-linux-${{ matrix.arch }}-${{ needs.prepare.outputs.tag }}
          path: |
            desktop/release-assets/*.tar.gz
            desktop/release-assets/*.deb
            desktop/release-assets/*.rpm
            desktop/release-assets/*.AppImage
          if-no-files-found: error

  # TEMP-DISABLED flutter-android-build:
  # Temporarily disabled while the desktop release publishes all Wails targets.
  # Re-enable by uncommenting this job and the publish references below.
  # flutter-android-build:
