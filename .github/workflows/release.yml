name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.TAG }}
      version: ${{ steps.version.outputs.VERSION }}
      tag_exists: ${{ steps.check_tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract latest version from RELEASE.md
        id: version
        run: |
          VERSION=$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' RELEASE.md | sed -E 's/^## //')
          if [ -z "$VERSION" ]; then
            echo "Could not find a release heading like '## v1.2.3' in RELEASE.md" >&2
            exit 1
          fi
          echo "TAG=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Validate release versions
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const expected = process.env.RELEASE_VERSION
          const readJson = (path) => JSON.parse(fs.readFileSync(path, 'utf8'))
          const checks = [
            ['package.json', readJson('package.json').version],
            ['desktop/frontend/package.json', readJson('desktop/frontend/package.json').version],
            ['desktop/wails.json info.productVersion', readJson('desktop/wails.json').info?.productVersion],
          ]

          // Flutter pubspec uses `x.y.z+build`; compare the version part only.
          const pubspec = fs.readFileSync('flutter/pubspec.yaml', 'utf8')
          const flutterVersion = pubspec.match(/^version:\s*(.+)\s*$/m)?.[1]?.trim()
          checks.push(['flutter/pubspec.yaml', flutterVersion?.split('+')[0]])

          const mismatches = checks.filter(([, actual]) => actual !== expected)
          if (mismatches.length > 0) {
            for (const [label, actual] of mismatches) {
              console.error(`${label} (${actual ?? 'missing'}) must match RELEASE.md (${expected})`)
            }
            console.error('Update Web/Desktop versions and RELEASE.md on dev, then merge dev into master to release.')
            process.exit(1)
          }
          NODE

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.version.outputs.TAG }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  desktop-windows-build:
    needs: prepare
    if: needs.prepare.outputs.tag_exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: windows/amd64
            runner: windows-2025
          - arch: arm64
            platform: windows/arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: desktop/go.sum

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          $goBin = Join-Path (go env GOPATH) 'bin'
          $goBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $goBin 'wails.exe') version

      - name: Install desktop frontend dependencies
        run: pnpm --filter mo-gallery-desktop-frontend install --no-frozen-lockfile --config.production=false

      - name: Verify desktop frontend dependencies
        working-directory: desktop/frontend
        run: pnpm list react-router-dom sonner

      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $makensis) {
            choco install nsis -y --no-progress
          }

          $candidatePaths = @(
            'C:\Program Files (x86)\NSIS',
            'C:\Program Files\NSIS'
          )
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if ($makensis) {
            $candidatePaths += Split-Path $makensis.Source
          }

          $nsisPath = $candidatePaths |
            Select-Object -Unique |
            Where-Object { Test-Path (Join-Path $_ 'makensis.exe') } |
            Select-Object -First 1
          if (-not $nsisPath) {
            throw 'makensis.exe was not found on the Windows runner.'
          }
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build portable executable and NSIS installer
        working-directory: desktop
        shell: pwsh
        run: wails build -clean -nsis -platform ${{ matrix.platform }}

      - name: Normalize Windows artifact names
        working-directory: desktop
        shell: pwsh
        run: |
          $destination = Join-Path $PWD 'release-assets'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null

          $installer = Get-ChildItem 'build/bin' -File -Filter '*-installer.exe' | Select-Object -First 1
          $portable = Get-ChildItem 'build/bin' -File -Filter '*.exe' |
            Where-Object { -not $installer -or $_.FullName -ne $installer.FullName } |
            Select-Object -First 1

          if (-not $portable -or -not $installer) {
            Get-ChildItem 'build/bin' -Recurse | Select-Object FullName
            throw 'Expected both a portable executable and an NSIS installer.'
          }

          $baseName = 'mo-gallery-desktop-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}'
          Copy-Item $portable.FullName (Join-Path $destination "$baseName-portable.exe")
          Copy-Item $installer.FullName (Join-Path $destination "$baseName-setup.exe")

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mo-gallery-desktop-windows-${{ matrix.arch }}-${{ needs.prepare.outputs.tag }}
          path: desktop/release-assets/*.exe
          if-no-files-found: error

  desktop-macos-build:
    needs: prepare
    if: needs.prepare.outputs.tag_exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: darwin/amd64
            runner: macos-15-intel
          - arch: arm64
            platform: darwin/arm64
            runner: macos-15
          - arch: universal
            platform: darwin/universal
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: desktop/go.sum

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/wails" version

      - name: Install desktop frontend dependencies
        run: pnpm --filter mo-gallery-desktop-frontend install --no-frozen-lockfile --config.production=false

      - name: Verify desktop frontend dependencies
        working-directory: desktop/frontend
        run: pnpm list react-router-dom sonner

      - name: Build macOS application
        working-directory: desktop
        run: wails build -clean -platform ${{ matrix.platform }}

      - name: Archive macOS application bundle
        working-directory: desktop
        run: |
          APP_PATH='build/bin/mo-gallery-desktop.app'
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected application bundle not found: $APP_PATH" >&2
            exit 1
          fi
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" \
            "release-assets/mo-gallery-desktop-${{ needs.prepare.outputs.version }}-macos-${{ matrix.arch }}.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mo-gallery-desktop-macos-${{ matrix.arch }}-${{ needs.prepare.outputs.tag }}
          path: desktop/release-assets/*.zip
          if-no-files-found: error

  desktop-linux-build:
    needs: prepare
    if: needs.prepare.outputs.tag_exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: desktop/go.sum

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/wails" version

      - name: Install desktop frontend dependencies
        run: pnpm --filter mo-gallery-desktop-frontend install --no-frozen-lockfile --config.production=false

      - name: Verify desktop frontend dependencies
        working-directory: desktop/frontend
        run: pnpm list react-router-dom sonner

      - name: Build Linux application
        working-directory: desktop
        run: wails build -clean -platform ${{ matrix.platform }} -tags webkit2_41

      - name: Archive Linux executable
        working-directory: desktop
        run: |
          BINARY_PATH='build/bin/mo-gallery-desktop'
          if [ ! -f "$BINARY_PATH" ]; then
            echo "Expected executable not found: $BINARY_PATH" >&2
            exit 1
          fi
          mkdir -p release-assets/package
          install -m 0755 "$BINARY_PATH" release-assets/package/mo-gallery-desktop
          tar -C release-assets/package -czf \
            "release-assets/mo-gallery-desktop-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}.tar.gz" \
            mo-gallery-desktop

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: mo-gallery-desktop-linux-${{ matrix.arch }}-${{ needs.prepare.outputs.tag }}
          path: desktop/release-assets/*.tar.gz
          if-no-files-found: error

