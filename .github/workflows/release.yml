name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.TAG }}
      version: ${{ steps.version.outputs.VERSION }}
      tag_exists: ${{ steps.check_tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Flutter 客户端是独立仓库（ushaio/emulsion-app），版本校验需要它的 pubspec
      - uses: actions/checkout@v4
        with:
          repository: ushaio/emulsion-app
          path: flutter
          fetch-depth: 1

      - name: Extract latest version from RELEASE.md
        id: version
        run: |
          VERSION=$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' RELEASE.md | sed -E 's/^## //')
          if [ -z "$VERSION" ]; then
            echo "Could not find a release heading like '## v1.2.3' in RELEASE.md" >&2
            exit 1
          fi
          echo "TAG=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Validate release versions
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const expected = process.env.RELEASE_VERSION
          const readJson = (path) => JSON.parse(fs.readFileSync(path, 'utf8'))
          const checks = [
            ['package.json', readJson('package.json').version],
          ]

          // Flutter pubspec uses `x.y.z+build`; compare the version part only.
          const pubspec = fs.readFileSync('flutter/pubspec.yaml', 'utf8')
          const flutterVersion = pubspec.match(/^version:\s*(.+)\s*$/m)?.[1]?.trim()
          checks.push(['flutter/pubspec.yaml', flutterVersion?.split('+')[0]])

          const mismatches = checks.filter(([, actual]) => actual !== expected)
          if (mismatches.length > 0) {
            for (const [label, actual] of mismatches) {
              console.error(`${label} (${actual ?? 'missing'}) must match RELEASE.md (${expected})`)
            }
            console.error('Update Web versions and RELEASE.md on dev, then merge dev into master to release.')
            process.exit(1)
          }
          NODE

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.version.outputs.TAG }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: prepare
    if: needs.prepare.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.prepare.outputs.tag }}"
          git push origin "${{ needs.prepare.outputs.tag }}"

      - name: Extract release notes
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const lines = fs.readFileSync('RELEASE.md', 'utf8').split(/\r?\n/)
          const headingPattern = /^## v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\s|$)/
          const start = lines.findIndex((line) => headingPattern.test(line))
          const end = lines.findIndex((line, index) => index > start && headingPattern.test(line))
          const notes = lines.slice(start + 1, end === -1 ? undefined : end).join('\n').trim()

          if (start === -1 || !notes) {
            console.error('Could not extract non-empty notes for the latest release from RELEASE.md')
            process.exit(1)
          }

          fs.writeFileSync('release-notes.md', `${notes}\n`)
          NODE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
