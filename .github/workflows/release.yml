  #         if-no-files-found: error

  publish:
    needs:
      - prepare
      - node-runtime
      - desktop-windows-build
      - desktop-macos-build
      - desktop-linux-build
      # - flutter-android-build
    if: needs.prepare.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mo-gallery-desktop-*-${{ needs.prepare.outputs.tag }}
          path: release-assets
          merge-multiple: true

      # - name: Download Android artifact
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: mo-gallery-mobile-android-${{ needs.prepare.outputs.tag }}
      #     path: release-assets

      - name: Verify release assets
        run: |
          expected_assets=(
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-windows-amd64-portable.exe"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-windows-amd64-setup.exe"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-macos-amd64.zip"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-macos-amd64.dmg"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-macos-amd64.pkg"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-macos-arm64.zip"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-macos-arm64.dmg"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-macos-arm64.pkg"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-macos-universal.zip"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-macos-universal.dmg"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-macos-universal.pkg"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-linux-amd64.tar.gz"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-linux-amd64.deb"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-linux-amd64.rpm"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-linux-amd64.AppImage"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-linux-arm64.tar.gz"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-linux-arm64.deb"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-linux-arm64.rpm"
            "mo-gallery-desktop-${{ needs.prepare.outputs.version }}-linux-arm64.AppImage"
          )
          for asset in "${expected_assets[@]}"; do
            if [ ! -f "release-assets/$asset" ]; then
              echo "Missing release asset: $asset" >&2
              exit 1
            fi
          done

      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.prepare.outputs.tag }}"
          git push origin "${{ needs.prepare.outputs.tag }}"

      - name: Extract release notes
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const lines = fs.readFileSync('RELEASE.md', 'utf8').split(/\r?\n/)
          const headingPattern = /^## v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\s|$)/
          const start = lines.findIndex((line) => headingPattern.test(line))
          const end = lines.findIndex((line, index) => index > start && headingPattern.test(line))
          const notes = lines.slice(start + 1, end === -1 ? undefined : end).join('\n').trim()

          if (start === -1 || !notes) {
            console.error('Could not extract non-empty notes for the latest release from RELEASE.md')
            process.exit(1)
          }

          fs.writeFileSync('release-notes.md', `${notes}\n`)
          NODE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          body_path: release-notes.md
          files: release-assets/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
